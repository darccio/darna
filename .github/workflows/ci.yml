name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned to the exact local version: .golangci.yml uses `default: all`,
          # so a floating version auto-enables new/renamed linters (verified:
          # v2.13.1 surfaces 9 findings v2.11.4 doesn't, from linter renames
          # like exhaustruct -> exhaustruct_v5) and breaks unrelated commits.
          version: v2.11.4
          args: ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test with coverage
        run: make coverage

      - name: Summarise coverage
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          if [ -z "$total" ]; then
            echo "no total: line found in coverage.out" >&2
            exit 1
          fi
          {
            echo "## Coverage"
            echo
            echo "**Total: ${total}**"
            echo
            echo "<details><summary>Per-function breakdown</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn
          retention-days: 14
